name: CI & Deploy

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  linter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, sockets, pdo_pgsql
          tools: composer
          coverage: none

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run PHP-CS-Fixer (dry-run)
        id: lint
        run: composer lint
        continue-on-error: true

      - name: Show friendly error message on failure
        if: steps.lint.outcome == 'failure'
        run: |
          echo "❌ Hallo mein Lieber. Du verstehst, dass ein solcher Code hier nicht funktionieren wird, oder? Korrigiere dieses Missverständnis, bevor niemand es sieht, ich werde dich decken)"
          exit 418

  unclestan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, sockets, pdo_pgsql
          tools: phpstan
          coverage: none

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Determine strictness level
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "push" && ( "${{ github.ref_name }}" == "dev" || "${{ github.ref_name }}" == "main" ) ]] || \
             [[ "${{ github.event_name }}" == "pull_request" && ( "${{ github.base_ref }}" == "dev" || "${{ github.base_ref }}" == "main" ) ]]; then
            echo "level=6" >> $GITHUB_OUTPUT
            echo "continue_on_error=false" >> $GITHUB_OUTPUT
          else
            echo "level=5" >> $GITHUB_OUTPUT
            echo "continue_on_error=true" >> $GITHUB_OUTPUT
          fi

      - name: Run PHPStan
        id: phpstan
        continue-on-error: ${{ fromJSON(steps.vars.outputs.continue_on_error) }}
        run: |
          phpstan analyse core modules \
            --level=${{ steps.vars.outputs.level }} \
            --no-progress \
            --error-format=github

      - name: Show friendly message on failure (non‑strict)
        if: |
          steps.vars.outputs.continue_on_error == 'true' &&
          steps.phpstan.outcome == 'failure'
        run: |
          echo "⚠️  Es gibt keine schwerwiegenden Fehler in deinem Code, aber ich schlage vor, sie vor der Veröffentlichung zu korrigieren."
          echo "📝  Исправь опечатки, проблемы с PHPDoc и мёртвый код, чтобы в будущем избежать проблем."

      - name: Show friendly message on failure (strict)
        if: |
          steps.vars.outputs.continue_on_error == 'false' &&
          steps.phpstan.outcome == 'failure'
        run: |
          echo "❌  Kritische Probleme wurden im Code gefunden. Korrigiere sie, bevor du mit ${{ github.base_ref }}."
          echo "❌  В коде обнаружены критические проблемы. Исправь их перед слиянием с ${{ github.base_ref }}."
          exit 418

  tests:
    runs-on: ubuntu-latest
    needs: [linter, unclestan]
    if: |
      (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'dev')) ||
      (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'dev'))
    env:
      APP_ENV: test
      APP_DEBUG: 'false'
      APP_NAME: IDEAKIT
      ADMIN_EMAIL: admin@example.test
      SENDER_EMAIL: no-reply@example.test
      SENDER_NAME: IDEAKIT
      DB_DSN: 'pgsql:host=127.0.0.1;port=5432;dbname=ideakit_test'
      DB_USERNAME: ideakit
      DB_PASSWORD: local-development-only
      TEST_DB_DSN: 'pgsql:host=127.0.0.1;port=5432;dbname=ideakit_test'
      TEST_DB_USERNAME: ideakit
      TEST_DB_PASSWORD: local-development-only
      TEST_RABBITMQ_HOST: 127.0.0.1
      TEST_RABBITMQ_PORT: '5673'
      TEST_RABBITMQ_USER: transport-test
      TEST_RABBITMQ_PASSWORD: local-transport-test-only
      TEST_RABBITMQ_VHOST: ideakit_transport_test
      RABBITMQ_HOST: 127.0.0.1
      RABBITMQ_PORT: '5673'
      RABBITMQ_USER: transport-test
      RABBITMQ_PASSWORD: local-transport-test-only
      RABBITMQ_VHOST: ideakit_transport_test
      RABBITMQ_CONNECTION_TIMEOUT: '3'
      RABBITMQ_CHANNEL_RPC_TIMEOUT: '5'
      RABBITMQ_HEARTBEAT: '10'
      RABBITMQ_READ_TIMEOUT: '25'
      RABBITMQ_WRITE_TIMEOUT: '25'
      RABBITMQ_CONFIRM_TIMEOUT: '5'
      RABBITMQ_CONSUMER_POLL_TIMEOUT: '1'
      OUTBOX_RELAY_LIMIT: '10'
      OUTBOX_RELAY_MAX_ATTEMPTS: '5'
      OUTBOX_RELAY_LEASE_SECONDS: '600'
      OUTBOX_RELAY_RETRY_BASE_SECONDS: '15'
      OUTBOX_RELAY_RETRY_MAX_SECONDS: '900'
      CRITICAL_WORKER_MAX_MESSAGES: '1000'
      CRITICAL_WORKER_MAX_RUNTIME_SECONDS: '3600'
      CRITICAL_WORKER_HANDLER_TIMEOUT_SECONDS: '4'
      CRITICAL_WORKER_BROKER_OPERATION_TIMEOUT_SECONDS: '10'
      CRITICAL_WORKER_RECEIVE_TIMEOUT_SECONDS: '1'
      CRITICAL_WORKER_MEMORY_LIMIT_MIB: '256'
      CRITICAL_WORKER_SOFT_MEMORY_LIMIT_MIB: '192'
      CRITICAL_WORKER_SHUTDOWN_TIMEOUT_SECONDS: '10'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, sockets, pdo_pgsql, pcntl
          ini-values: variables_order=EGPCS
          tools: composer
          coverage: none

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Start test environment (PostgreSQL)
        run: |
          docker compose up -d --wait postgres
          exists=$(docker compose exec -T postgres psql -U ideakit -d postgres -v ON_ERROR_STOP=1 -Atc "SELECT 1 FROM pg_database WHERE datname = 'ideakit_test'")
          if [ "$exists" != '1' ]; then
            docker compose exec -T postgres createdb -U ideakit ideakit_test
          fi

      - name: Prepare isolated RabbitMQ test broker
        run: |
          docker compose --profile messaging-test up -d --wait rabbitmq-test
          docker compose exec -T rabbitmq-test su-exec rabbitmq sh /etc/ideakit-rabbitmq/apply-policy.sh

      - name: Run Codeception tests
        run: |
          php -r 'require "vendor/autoload.php"; require "vendor/yiisoft/yii2/Yii.php"; try { tests\fixtures\platform\PlatformTestEnvironment::preflight(); } catch (Throwable) { fwrite(STDERR, "test_environment_unavailable\n"); exit(1); }'
          php tests/bin/yii migrate/up --interactive=0
          composer test -- --no-colors
  deploy:
    runs-on: ubuntu-latest
    needs: [linter, unclestan, tests]
    if: |
      github.event_name == 'push' &&
      (github.ref_name == 'main' || github.ref_name == 'dev') &&
      needs.linter.result == 'success' &&
      needs.unclestan.result == 'success' &&
      (needs.tests.result == 'success' || needs.tests.result == 'skipped')
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - name: Deploy with rsync
        run: |
          rsync -avz --delete \
            --exclude='.env' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='tests/' \
            --exclude='codeception.yml' \
            --exclude='.gitignore' \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.HOST }}:${{ secrets.SSH_TARGET_PATH }}

      - name: Install dependencies on server
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.HOST }} \
            "cd ${{ secrets.SSH_TARGET_PATH }} && composer install --no-dev --optimize-autoloader"

      - name: Clear cache (optional)
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.HOST }} \
            "cd ${{ secrets.SSH_TARGET_PATH }} && php yii cache/flush-all || true"
