server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /app/web;
    index index.php;
    charset utf-8;
    server_tokens off;

    client_max_body_size 10m;

    location = /health/live {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /health/ready {
        access_log off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /health/ready;
        fastcgi_param SCRIPT_NAME /health/ready;
        fastcgi_param REQUEST_METHOD GET;
        fastcgi_pass php-fpm:9000;
        fastcgi_connect_timeout 3s;
        fastcgi_send_timeout 5s;
        fastcgi_read_timeout 5s;
    }

    location = /fpm-status {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/web/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /app/web;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass php-fpm:9000;
        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php(?:/|$) {
        return 404;
    }

    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
    }

    location ~* ^/(?:config|docker|runtime|tests|vendor)(?:/|$) {
        deny all;
    }

    location ~* \.(?:bak|conf|dist|env|ini|lock|log|sql|ya?ml)$ {
        deny all;
    }
}
