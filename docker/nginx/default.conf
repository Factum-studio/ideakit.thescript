server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /app/web;
    index index.php;
    charset utf-8;
    server_tokens off;

    client_max_body_size 10m;

    location = /health/live {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /health/ready {
        access_log off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /health/ready;
        fastcgi_param SCRIPT_NAME /health/ready;
        fastcgi_param REQUEST_METHOD GET;
        fastcgi_pass php-fpm:9000;
        fastcgi_connect_timeout 3s;
        fastcgi_send_timeout 5s;
        fastcgi_read_timeout 5s;
    }

    location = /fpm-status {
        return 404;
    }

    location = /telegram/webhook {
        client_max_body_size 64k;
        access_log off;
        # Keep each parameter unique while routing directly to the front controller.
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param SCRIPT_FILENAME /app/web/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param DOCUMENT_URI $document_uri;
        fastcgi_param DOCUMENT_ROOT /app/web;
        fastcgi_param SERVER_PROTOCOL $server_protocol;
        fastcgi_param REQUEST_SCHEME $scheme;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param GATEWAY_INTERFACE CGI/1.1;
        fastcgi_param SERVER_SOFTWARE nginx/$nginx_version;
        fastcgi_param REMOTE_ADDR $remote_addr;
        fastcgi_param REMOTE_PORT $remote_port;
        fastcgi_param SERVER_ADDR $server_addr;
        fastcgi_param SERVER_PORT $server_port;
        fastcgi_param SERVER_NAME $server_name;
        fastcgi_param REDIRECT_STATUS 200;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass php-fpm:9000;
        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
        fastcgi_hide_header X-Powered-By;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/web/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /app/web;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass php-fpm:9000;
        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php(?:/|$) {
        return 404;
    }

    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
    }

    location ~* ^/(?:config|docker|runtime|tests|vendor)(?:/|$) {
        deny all;
    }

    location ~* \.(?:bak|conf|dist|env|ini|lock|log|sql|ya?ml)$ {
        deny all;
    }
}
