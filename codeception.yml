actor: Tester
bootstrap: _bootstrap.php
paths:
    tests: tests
    output: tests/_output
    data: tests/_data
    helpers: tests/_support
settings:
    memory_limit: 1024M
    colors: true
modules:
    config:
        Yii2:
            configFile: 'config/test.php'
coverage:
    #c3_url: http://localhost:8080/index-test.php/
    enabled: true
    low_limit: 30
    high_limit: 70
    #remote: true
    #remote_config: '../codeception.yml'
    include:
        - core/*
        - modules/*
    exclude:
        - core/infrastructure/migrations/*
        - core/presentation/swagger/*
        - core/presentation/view/*
